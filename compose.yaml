services:
  api:
    build:
      context: .
      dockerfile: DockerFile
      # container_name: todo-api-tite
    ports:
      - "3000:3000"
    env_file:
      - .env
    
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    #ports:
      #- "5432:5432"
    volumes:
    - postgres-data:/var/lib/postgresql/data
    
volumes:
  postgres-data: